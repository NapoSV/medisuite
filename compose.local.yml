# Desarrollo y demostración aislados. No utiliza la conexión de .env.
name: medisuite-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinica_dev
      POSTGRES_USER: medisuite_local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Define LOCAL_DB_PASSWORD en .env.local}
      TZ: America/El_Salvador
    volumes:
      - postgres_local:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U medisuite_local -d clinica_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      APP_ENV: development
      APP_PORT: 8097
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clinica_dev
      DB_USERNAME: medisuite_local
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Define LOCAL_DB_PASSWORD en .env.local}
      DB_SSLMODE: disable
      JWT_SECRET: ${LOCAL_JWT_SECRET:?Define LOCAL_JWT_SECRET en .env.local}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TZ: America/El_Salvador
    ports:
      - "127.0.0.1:8097:8097"
    volumes:
      - backend_local:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8097/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8097
        VITE_TENANT_SLUG: clinica-san-rafael
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_local:
  backend_local:
