services:
  db:
    image: postgres:16
    container_name: medisuite_db
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_dev}
      POSTGRES_USER: ${DB_USERNAME:-clinica_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinica_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
